<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תכלס | הרשמה</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #fcfcfc;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #1d1d1f;
        }

        .signup-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            border: 1px solid #eaeaea;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .logo-container {
            margin-bottom: 16px;
        }

        .logo {
            width: 60px; /* לוגו קטן ואלגנטי */
            height: auto;
            opacity: 0.9;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 14px;
            color: #86868b;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .input-wrapper {
            margin-bottom: 12px;
        }

        input[type="email"] {
            width: 100%;
            padding: 14px 18px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            background: #f5f5f7;
            transition: all 0.2s ease;
            outline: none;
            text-align: center;
        }

        input[type="email"]:focus {
            background: #fff;
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: #1d1d1f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #424245;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        #success-msg {
            display: none;
            background: #f2faf3;
            color: #1d7c3d;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-top: 10px;
        }

        .footer-info {
            font-size: 11px;
            color: #b6b6b8;
            margin-top: 24px;
            text-transform: lowercase;
        }

        /* אנימציית טעינה פשוטה */
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="signup-card" id="mainCard">
    <div class="logo-container">
        <img src="https://i.ibb.co/YzL4Nvb/image.png" alt="תכלס" class="logo">
    </div>
    
    <h2>תכלס</h2>
    <p>מהדורת חדשות יומית קצרה וקולעת.</p>

    <form id="subscribeForm">
        <div class="input-wrapper">
            <input type="email" name="email" id="emailInput" placeholder="המייל שלך" required>
        </div>
        <button type="submit" id="submitBtn">הצטרפות</button>
    </form>

    <div id="success-msg">המייל נרשם, ויצורף לקבוצה בשעות הקרובות.</div>
    
    <div class="footer-info">tachles@hamakom.ovh</div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzXxXMslfkz1ZgopwhL2iiwuhNCgzbOqYYfyCYXFH6uLzzaH56laDxkl7R10x1T8EI2NA/exec';
    const form = document.getElementById('subscribeForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('success-msg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btn.innerText = 'מצרף אותך...';
        btn.classList.add('loading');

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                form.style.display = 'none';
                msg.style.display = 'block';
            })
            .catch(error => {
                alert('אופס, משהו השתבש. נסה שוב!');
                btn.innerText = 'הצטרפות';
                btn.classList.remove('loading');
            });
    });
</script>

</body>
</html>
