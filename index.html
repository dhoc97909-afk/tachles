<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>תכלס | הרשמה</title>
    <!-- הוספת הלוגו כסמל בכרטיסייה (Favicon) -->
    <link rel="icon" type="image/png" href="https://i.ibb.co/YzL4Nvb/image.png">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #fcfcfc;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1d1d1f;
        }

        .signup-card {
            background: #ffffff;
            padding: 32px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid #eaeaea;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .logo-container {
            margin-bottom: 16px;
        }

        .logo {
            width: 60px;
            height: auto;
            opacity: 0.9;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 15px;
            color: #86868b;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        /* סגנון כפתור הקישור הישיר */
        .direct-link-box {
            background: #f5f5f7;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 2px solid #0071e3;
        }

        .btn-primary {
            display: block;
            background-color: #0071e3;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            margin-bottom: 10px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #0077ed;
        }

        .divider {
            margin: 24px 0;
            display: flex;
            align-items: center;
            text-align: center;
            color: #1d1d1f; /* צבע כהה יותר להדגשה */
            font-size: 14px; /* גופן מעט גדול יותר */
            font-weight: 700; /* הדגשה משמעותית */
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #ddd;
        }

        .divider:not(:empty)::before { margin-left: .8em; }
        .divider:not(:empty)::after { margin-right: .8em; }

        .input-wrapper {
            margin-bottom: 12px;
        }

        input[type="email"] {
            width: 100%;
            padding: 14px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            background: #fff;
            outline: none;
            text-align: center;
        }

        input[type="email"]:focus {
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #1d1d1f;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background-color: #424245;
        }

        .optional-label {
            display: block;
            font-size: 12px;
            color: #86868b;
            margin-bottom: 8px;
        }

        #success-msg {
            display: none;
            background: #f2faf3;
            color: #1d7c3d;
            padding: 15px;
            border-radius: 12px;
            font-size: 14px;
            margin-top: 10px;
        }

        .footer-info {
            font-size: 11px;
            color: #b6b6b8;
            margin-top: 24px;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="signup-card">
    <div class="logo-container">
        <img src="https://i.ibb.co/YzL4Nvb/image.png" alt="תכלס" class="logo">
    </div>
    
    <h2>תכלס</h2>
    <p class="subtitle">מהדורת חדשות יומית קצרה וקולעת.</p>

    <div class="direct-link-box">
        <strong style="display:block; margin-bottom:8px; font-size:14px;">הצטרפות עצמית (מומלץ):</strong>
        <a href="https://groups.google.com/a/hamakom.ovh/g/tachles" class="btn-primary">הקליקו כאן למעבר לקבוצה</a>
        <span style="font-size: 12px; color: #6e6e73;">ולחצו על "הצטרפות לקבוצה"</span>
    </div>

    <div class="divider">או אם לא הסתדרתם</div>

    <form id="subscribeForm">
        <span class="optional-label">ניתן לבקש מנציג להוסיף אתכם ידנית:</span>
        <div class="input-wrapper">
            <input type="email" name="email" id="emailInput" placeholder="הזינו מייל (אופציונלי)" required>
        </div>
        <button type="submit" id="submitBtn" class="submit-btn">שליחת בקשה לנציג</button>
    </form>

    <div id="success-msg">בקשתכם נשלחה, המייל יצורף לקבוצה על ידי נציג בשעות הקרובות.</div>
    
    <div class="footer-info">tachles@hamakom.ovh</div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzXxXMslfkz1ZgopwhL2iiwuhNCgzbOqYYfyCYXFH6uLzzaH56laDxkl7R10x1T8EI2NA/exec';
    const form = document.getElementById('subscribeForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('success-msg');

    form.addEventListener('submit', e => {
        e.preventDefault();
        
        btn.innerText = 'שולח בקשה...';
        btn.classList.add('loading');

        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(response => {
                form.style.display = 'none';
                msg.style.display = 'block';
            })
            .catch(error => {
                btn.innerText = 'אופס, נסו שוב';
                btn.classList.remove('loading');
                console.error('Error!', error.message);
            });
    });
</script>

</body>
</html>
